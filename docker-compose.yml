# Entorno local de desarrollo. Para Coolify/producción usar docker-compose.production.yml.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cazadores-crm
    restart: unless-stopped
    ports:
      - "8000:80"
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  db:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: cazadores_db
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-root}"
      MYSQL_USER: cazador_user

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"

    volumes:
      - db_data:/var/lib/mysql

    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      UPLOAD_LIMIT: 300M
      MEMORY_LIMIT: 500M
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

networks:
  app_network:
    name: cazadores
    driver: bridge

volumes:
  db_data:
  vendor_data:
  node_modules_data:
